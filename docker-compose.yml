version: "3.9"

services:
  windows:
    image: dockurr/windows:latest
    container_name: warvm-win11
    restart: unless-stopped
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    volumes:
      - windows-data:/storage
      - ./scripts:/oem:ro
    environment:
      VERSION: "win11"
      RAM_SIZE: "8G"
      CPU_CORES: "4"
      DISK_SIZE: "120G"
      USERNAME: "User"
      PASSWORD: "WarThunder1!"
      LANGUAGE: "English"
      KEYBOARD: "en-US"
      NETWORK: "user"
    ports:
      - "8006:8006"
      - "3389:3389"
    networks:
      - warvm-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  proxy:
    image: nginx:alpine
    container_name: warvm-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - windows
    networks:
      - warvm-net

  # Cloudflare quick tunnel — punches through home router NAT for free
  # Prints a public https://*.trycloudflare.com URL to the logs
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: warvm-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://proxy:80
    depends_on:
      - proxy
    networks:
      - warvm-net

volumes:
  windows-data:
    driver: local

networks:
  warvm-net:
    driver: bridge
