<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WarVM — Cloud Gaming</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(180, 60, 0, 0.25), transparent),
        radial-gradient(ellipse 60% 40% at 80% 110%, rgba(60, 100, 200, 0.15), transparent);
      pointer-events: none;
    }

    .container {
      position: relative;
      text-align: center;
      padding: 2rem;
      max-width: 700px;
    }

    .logo {
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, #ff6a00 0%, #ee0979 50%, #ff6a00 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 3s ease infinite;
      margin-bottom: 0.4rem;
    }

    @keyframes shimmer {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .tagline {
      font-size: 1.05rem;
      color: #888;
      margin-bottom: 2.5rem;
      letter-spacing: 0.05em;
    }

    .btn-launch {
      display: inline-block;
      padding: 1rem 3rem;
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #ff6a00, #ee0979);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      letter-spacing: 0.06em;
      box-shadow: 0 0 30px rgba(238, 9, 121, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn-launch:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 0 50px rgba(238, 9, 121, 0.6);
    }

    .btn-launch:active {
      transform: translateY(0) scale(0.99);
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-top: 2.5rem;
    }

    .info-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 1rem;
    }

    .info-card .icon { font-size: 1.6rem; margin-bottom: 0.4rem; }
    .info-card .label { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 0.08em; }
    .info-card .value { font-size: 0.95rem; font-weight: 600; color: #ddd; margin-top: 0.15rem; }

    .status-bar {
      margin-top: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: #666;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #2ecc71;
      box-shadow: 0 0 8px #2ecc71;
      animation: pulse 2s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    .rdp-note {
      margin-top: 1.2rem;
      font-size: 0.78rem;
      color: #555;
    }

    .rdp-note a { color: #888; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">⚡ WarVM</div>
    <p class="tagline">Windows 11 · Chrome · War Thunder · Cloud</p>

    <a class="btn-launch" href="/vm/" target="_blank">Launch VM</a>

    <div class="info-grid">
      <div class="info-card">
        <div class="icon">🪟</div>
        <div class="label">OS</div>
        <div class="value">Windows 11</div>
      </div>
      <div class="info-card">
        <div class="icon">🎮</div>
        <div class="label">Game</div>
        <div class="value">War Thunder</div>
      </div>
      <div class="info-card">
        <div class="icon">🌐</div>
        <div class="label">Browser</div>
        <div class="value">Chrome</div>
      </div>
      <div class="info-card">
        <div class="icon">💾</div>
        <div class="label">RAM</div>
        <div class="value">8 GB</div>
      </div>
      <div class="info-card">
        <div class="icon">⚙️</div>
        <div class="label">CPU</div>
        <div class="value">4 vCores</div>
      </div>
      <div class="info-card">
        <div class="icon">💿</div>
        <div class="label">Disk</div>
        <div class="value">120 GB</div>
      </div>
    </div>

    <div class="status-bar">
      <div class="dot"></div>
      VM Online — connect via browser below
    </div>

    <p class="rdp-note">
      Prefer RDP? Use any Remote Desktop client → <strong>host:3389</strong><br/>
      Credentials: <code>User</code> / <code>WarThunder1!</code>
    </p>
  </div>
</body>
</html>
